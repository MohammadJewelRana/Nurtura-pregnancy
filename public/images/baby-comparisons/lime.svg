  <!-- Gloss highlight -->
  <ellipse cx="46" cy="50" rx="8" ry="14" fill="#FFFFFF" opacity="0.3" transform="rotate(-20 46 50)" />
  <circle cx="48" cy="46" r="3" fill="#FFFFFF" opacity="0.6" />
</svg>