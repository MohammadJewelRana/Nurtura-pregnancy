  <path d="M38 52 C32 68, 32 84, 40 94" stroke="#4D7C0F" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6" />
  <!-- Highlighting gloss -->
  <ellipse cx="48" cy="50" rx="5" ry="14" fill="#FFFFFF" opacity="0.35" transform="rotate(-15 48 50)" />
