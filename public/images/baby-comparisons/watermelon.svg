  <ellipse cx="44" cy="50" rx="7" ry="16" fill="#FFFFFF" opacity="0.4" transform="rotate(-20 44 50)" />
  <circle cx="46" cy="44" r="3.5" fill="#FFFFFF" opacity="0.75" />
